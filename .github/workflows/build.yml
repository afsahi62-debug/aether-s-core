name: Build Aether S Core (Android arm64)

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths: [ ".github/workflows/build.yml" ]

permissions:
  contents: write

jobs:
  android:
    name: Build aether-android-arm64
    runs-on: ubuntu-latest
    steps:
      - name: Download upstream Aether v2.4.0 source
        run: |
          curl -fsSL -o src.tgz https://github.com/CluvexStudio/Aether/archive/refs/tags/v2.4.0.tar.gz
          mkdir src && tar xzf src.tgz -C src --strip-components=1
          ls src

      - name: Apply Aether S speed patch (fast chained Psiphon)
        working-directory: src/aether
        run: python3 -c "import pathlib; p=pathlib.Path('src/psiphon.rs'); s=p.read_text(encoding='utf8'); old='        Shape::Auto => CHAINED_PROTOCOLS.to_vec(),'; new='        Shape::Auto => CHAINED_PROTOCOLS.iter().copied().filter(|name| !name.starts_with('+chr(39)+'F'+chr(39)+')).collect(),'; assert old in s, 'pattern not found'; p.write_text(s.replace(old, new, 1), encoding='utf8'); print('Aether S patch applied')"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Install CMake and Ninja
        uses: lukka/get-cmake@latest

      - name: Install Android NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build pluggable transports
        working-directory: src/aether
        run: bash ../pt-build.sh linux arm64 "$PWD/pt" "" "$PWD/LICENSES"

      - name: Build psiphon
        working-directory: src/aether
        run: bash ../psiphon-build.sh linux arm64 "$PWD/pt" "" "$PWD/LICENSES"

      - name: Build release binary (Aether S core)
        working-directory: src/aether
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.ndk.outputs.ndk-path }}
        run: cargo ndk -t arm64-v8a --platform 29 build --release --features tor

      - name: Collect artifact
        run: |
          mkdir -p dist/pt
          cp src/aether/target/aarch64-linux-android/release/aether dist/
          cp -R src/aether/pt/. dist/pt/ || true
          ls -lh dist dist/pt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: aether-s-core-android-arm64
          path: dist

      - name: Pack core zip
        run: |
          cd dist && zip -r ../aether-s-core-android-arm64.zip . && cd ..
          ls -lh aether-s-core-android-arm64.zip

      - name: Publish public release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: core-build-${{ github.run_number }}
          name: Aether S Core build ${{ github.run_number }}
          files: aether-s-core-android-arm64.zip
